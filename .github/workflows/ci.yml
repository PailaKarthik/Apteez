name: CI

# Pull-request quality gates. Every deployment workflow depends on this
# passing — a broken main build must never deploy (see deploy.yml).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  validate:
    name: lint / typecheck / tests / build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: apteez
          POSTGRES_PASSWORD: apteez
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apteez -d shadow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (API)
        run: pnpm --filter @apteez/api test

      - name: Unit tests (Web)
        run: pnpm --filter @apteez/web test

      - name: Prisma validate
        run: pnpm --filter @apteez/database exec prisma validate --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://apteez:apteez@localhost:5432/apteez?schema=public

      - name: Migration consistency (migrations match schema via shadow DB)
        run: pnpm --filter @apteez/database db:validate
        env:
          SHADOW_DATABASE_URL: postgresql://apteez:apteez@localhost:5432/shadow

      - name: Build all
        run: pnpm build

  security:
    name: dependency audit + secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Advisory report, not a hard gate: residual highs/criticals that require
      # major upgrades (Next.js 15) are triaged in SECURITY.md instead of
      # blocking every build. Any NEW fixable finding fails the release job.
      - name: Production dependency audit (advisory report)
        run: pnpm audit --prod --audit-level=high || echo "::warning::pnpm audit reported findings — see SECURITY.md triage"
        continue-on-error: true

      - name: Secret scan (gitleaks, blocking)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker builds (api / web / migrate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          push: false
          tags: apteez-api:ci

      - name: Build API migrate target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: false
          tags: apteez-migrate:ci

      - name: Build Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: apteez-web:ci
